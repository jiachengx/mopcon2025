const room = document.getElementById("room");
Object.keys(ROOMS).forEach(r => {
  const o=document.createElement("option");
  o.value=r;o.textContent=r;room.appendChild(o);
});
function refresh(){
 const r=ROOMS[room.value];
 document.getElementById("info").innerHTML = `YouTube：<a target="_blank" rel="noopener" href="${r.youtubeUrl}">${r.youtubeUrl}</a>`;
}
room.addEventListener("change",refresh);refresh();
function saveJson(name,obj){
 const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
document.getElementById("download").onclick=()=>{
 const r=ROOMS[room.value];
 saveJson("service.json",{
   settings:{
     bwtest:false,
     key:r.streamKey,
     server:r.serverUrl,
     service:"YouTube - RTMPS"
   },
   type:"rtmp_common"
 });
};
</script>
